<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dev-farm</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="user">dev@farma</span>:<span class="path">~/dev-farm</span>$</div>
    <div class="hud">
      <span class="hud-item"><strong id="hud-day">Dan 1</strong> · <span id="hud-clock">06:00</span></span>
      <span class="hud-item muted" id="hud-shop"></span>
      <span class="hud-item coins" id="hud-money"><img id="hud-gold-icon" class="coin" alt="zlatnici"><span id="hud-gold">0</span><img id="hud-silver-icon" class="coin" alt="srebrenjaci"><span id="hud-silver" class="silver">0</span></span>
      <span class="hud-item energy" title="Energija">
        ⚡ <span class="bar"><span id="hud-energy-bar"></span></span> <span id="hud-energy" class="muted"></span>
      </span>
    </div>
  </header>

  <main class="layout">
    <div class="main-col">
      <div class="world-wrap">
        <canvas id="world" aria-label="Farma. Klikni gdje farmer treba otići."></canvas>
        <div id="bubble" class="bubble" role="status" aria-live="polite" hidden></div>
        <div class="zoom" aria-label="Zoom">
          <button id="zoom-in" type="button" title="Približi (+)">+</button>
          <button id="zoom-out" type="button" title="Udalji (−)">−</button>
        </div>
      </div>
      <div class="toolbar">
        <div id="hotbar" class="hotbar" aria-label="Alati"></div>
        <div id="seeds" class="seeds" aria-label="Vrećica sa sjemenom"></div>
      </div>
      <p id="inspect" class="inspect" aria-live="polite"></p>
    </div>

    <aside class="side">
      <section id="panel" class="card panel"></section>
      <section class="card">
        <div class="card-title">torba</div>
        <div id="bag" class="slots"></div>
        <div id="bag-info" class="bag-info"></div>
      </section>
      <section class="phone" aria-label="Mobitel">
        <div class="phone-top">
          <span id="phone-time">06:00</span>
          <span class="phone-title">📱 Mobitel</span>
          <span class="phone-battery" aria-hidden="true">▮▮▮▯</span>
        </div>
        <div class="phone-tabs" role="tablist">
          <button type="button" data-tab="feed" role="tab">Obavijesti <span id="phone-badge" class="badge" hidden></span></button>
          <button type="button" data-tab="shop" role="tab">Dostava</button>
        </div>
        <div id="phone-feed" class="phone-feed" role="log" aria-live="polite"></div>
        <div id="phone-shop" class="phone-shop" hidden></div>
      </section>
    </aside>
  </main>

  <footer class="footer">
    <span class="muted">Spavanje u kući sprema igru. Dok je tab skriven, vrijeme stoji.</span>
    <button id="reset" type="button" class="reset">rm -rf farma</button>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
