<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BJJ Fighter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">BJJ Fighter <span class="tag">test</span></div>
  <div class="stats">
    <span id="belt" class="belt"></span>
    <span id="money" class="money"></span>
    <span id="record" class="record"></span>
  </div>
</header>

<main id="career">
  <section class="status" id="status"></section>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="club" class="active">Klub</button>
    <button role="tab" data-tab="activities">Aktivnosti</button>
    <button role="tab" data-tab="fights">Borbe</button>
    <button role="tab" data-tab="test">Test</button>
  </nav>
  <section class="panel" id="tab-club"></section>
  <section class="panel" id="tab-activities" hidden></section>
  <section class="panel" id="tab-fights" hidden></section>
  <section class="panel" id="tab-test" hidden></section>
</main>

<section id="fight" hidden>
  <div class="scoreboard">
    <div class="side p"><div class="name" id="sb-p-name"></div><div class="pts" id="sb-p"></div></div>
    <div class="clock"><div id="sb-round"></div><div id="sb-clock"></div></div>
    <div class="side o"><div class="name" id="sb-o-name"></div><div class="pts" id="sb-o"></div></div>
  </div>
  <div class="stage">
    <canvas id="canvas"></canvas>
    <div class="pos-label" id="pos-label"></div>
    <div class="feedback" id="feedback" hidden></div>
    <div class="critical" id="critical" hidden>
      <div class="critical-text" id="critical-text"></div>
      <div class="timer"><div id="critical-timer"></div></div>
      <div class="legend"><span><i style="background:#e0524f"></i>napad</span><span><i style="background:#4b8df0"></i>obrana</span><span><i style="background:#3fb27f"></i>kontrola</span><span><i style="background:#e3b341"></i>pozicija</span></div>
      <div class="options" id="critical-options"></div>
    </div>
    <div class="result" id="result" hidden></div>
  </div>
  <div class="fight-bottom">
    <ol class="log" id="log"></ol>
    <div class="fight-actions">
      <button class="secondary" id="copy-log">Kopiraj log</button>
      <button class="ghost" id="give-up">Odustani</button>
    </div>
  </div>
</section>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
