<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dev-farm</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="user">dev@farma</span>:<span class="path">~/dev-farm</span>$</div>
    <div class="hud">
      <span class="hud-item"><strong id="hud-day">Dan 1</strong> · <span id="hud-clock">06:00</span></span>
      <span class="hud-item muted" id="hud-shop"></span>
      <span class="hud-item coins"><span id="hud-coins">0</span> 🪙</span>
      <span class="hud-item energy" title="Energija">
        ⚡ <span class="bar"><span id="hud-energy-bar"></span></span> <span id="hud-energy" class="muted"></span>
      </span>
    </div>
  </header>

  <main class="layout">
    <div class="main-col">
      <div class="world-wrap">
        <canvas id="world" aria-label="Farma. Klikni gdje farmer treba otići."></canvas>
      </div>
      <div class="toolbar">
        <div id="hotbar" class="hotbar" aria-label="Alati"></div>
        <div id="seeds" class="seeds" aria-label="Sjeme"></div>
      </div>
      <p id="inspect" class="inspect" aria-live="polite"></p>
    </div>

    <aside class="side">
      <section id="panel" class="card panel"></section>
      <section class="card">
        <div class="card-title">torba</div>
        <div id="bag" class="slots"></div>
        <div id="bag-info" class="bag-info"></div>
      </section>
      <section class="card">
        <div class="card-title">terminal</div>
        <div id="terminal" class="terminal" role="log" aria-live="polite"></div>
      </section>
    </aside>
  </main>

  <footer class="footer">
    <span class="muted">Spavanje u kući sprema igru. Dok je tab skriven, vrijeme stoji.</span>
    <button id="reset" type="button" class="reset">rm -rf farma</button>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
